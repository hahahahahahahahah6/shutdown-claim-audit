[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shutdown-claim-audit"
version = "0.1.0"
description = "Offline audit of documented interruption promises against Python source."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
shutdown-claim-audit = "shutdown_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
